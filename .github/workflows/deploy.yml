name: Desplegar GoDeporte Académico
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godeporte-academico-cloudflare
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: academico
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_IDS: ${{ vars.D1_IDS }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      GATEWAY_URL: ${{ vars.GATEWAY_URL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/migrate.sh --remote
      - run: pnpm check && pnpm build
      - run: |
          for service in auth canchas pagos reservas notificaciones gateway; do
            pnpm exec wrangler deploy -c ".local/$service.json"
          done
      - run: pnpm exec wrangler pages deploy dist/godeporte/browser --project-name godeporte-academico --branch main
