version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: godeporte-gateway
    ports:
      - "8080:8080"
    environment:
      - PAGOS_SERVICE_URL=http://ms-pagos:8003
      - RESERVAS_SERVICE_URL=http://ms-reservas:8001
    networks:
      - godeporte-network
    depends_on:
      - ms-pagos
      - ms-reservas
    restart: unless-stopped

  ms-pagos:
    build:
      context: .
      dockerfile: ms-pagos/Dockerfile
    container_name: godeporte-pagos
    ports:
      - "8003:8003"
    volumes:
      - pagos-data:/app/ms-pagos
    networks:
      - godeporte-network
    restart: unless-stopped

  ms-reservas:
    build:
      context: .
      dockerfile: ms-reservas/Dockerfile
    container_name: godeporte-reservas
    ports:
      - "8001:8001"
    environment:
      - MS_PAGOS_URL=http://ms-pagos:8003
    networks:
      - godeporte-network
    restart: unless-stopped

volumes:
  pagos-data:
    driver: local

networks:
  godeporte-network:
    driver: bridge
