services:
  ms-pagos:
    build:
      context: .
      dockerfile: ms-pagos/Dockerfile
    ports: ["8003:8003"]
    networks: [godeporte-network]

  # Servicios independientes; SQLite local por servicio.
  ms-reservas:
    build:
      context: .
      dockerfile: ms-reservas/Dockerfile
    ports: ["8001:8001"]
    environment:
      MS_PAGOS_URL: http://ms-pagos:8003
      MS_CANCHAS_URL: http://ms-canchas:8002
      MS_NOTIFICACIONES_URL: http://ms-notificaciones:8005
    networks: [godeporte-network]

  ms-canchas:
    build:
      context: .
      dockerfile: ms-canchas/Dockerfile
    ports: ["8002:8002"]
    networks: [godeporte-network]

  ms-auth:
    build:
      context: .
      dockerfile: ms-auth/Dockerfile
    ports: ["8004:8004"]
    networks: [godeporte-network]

  ms-notificaciones:
    build:
      context: .
      dockerfile: ms-notificaciones/Dockerfile
    ports: ["8005:8005"]
    networks: [godeporte-network]

networks:
  godeporte-network:
    driver: bridge
